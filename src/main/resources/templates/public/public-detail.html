<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle=${news.title})}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main style="padding-top:72px">
  <!-- HERO IMAGE -->
  <div style="position:relative;height:480px;overflow:hidden">
    <img th:src="${news.imageUrl}" th:alt="${news.title}"
         onerror="this.src='https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&q=80'"
         style="width:100%;height:100%;object-fit:cover"/>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(19,27,46,0.75))"></div>
    <div class="container" style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;padding-bottom:40px">
      <span class="card__tag tag--pill-primary" style="margin-bottom:16px;display:inline-block">Noticias</span>
      <h1 style="font-size:40px;font-weight:700;line-height:1.2;color:white;max-width:800px" th:text="${news.title}">Título</h1>
    </div>
  </div>

  <!-- CONTENT -->
  <section class="section section--white">
    <div class="container" style="max-width:860px;margin:0 auto">
      <!-- META -->
      <div style="display:flex;align-items:center;gap:24px;margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid rgba(199,196,215,0.30)" class="card__meta">
        <span style="display:flex;align-items:center;gap:6px">
          <span class="material-symbols-outlined" style="font-size:18px">calendar_today</span>
          <span th:text="${#temporals.format(news.publishDate,'dd MMMM, yyyy')}">Fecha</span>
        </span>
        <span style="display:flex;align-items:center;gap:6px">
          <span class="material-symbols-outlined" style="font-size:18px">person</span>
          <span th:text="${news.author}">Autor</span>
        </span>
        <span style="margin-left:auto">
          <span th:class="${news.status.name() == 'STATE_PUBLISHED'} ? 'badge badge--green' : 'badge badge--yellow'" th:text="${news.status.displayName}">Estado</span>
        </span>
      </div>

      <!-- SUMMARY -->
      <p class="body-lg" style="color:var(--color-on-surface-variant);margin-bottom:32px;font-style:italic;border-left:4px solid var(--color-primary);padding-left:20px" th:text="${news.summary}">Resumen</p>

      <!-- CONTENT BODY -->
      <div style="font-size:18px;line-height:1.8;color:var(--color-on-surface)" th:utext="${news.content}">Contenido completo</div>

      <!-- BACK BUTTON -->
      <div style="margin-top:56px;padding-top:32px;border-top:1px solid rgba(199,196,215,0.30)">
        <a href="/news/public" class="btn btn--outline">
          <span class="material-symbols-outlined">arrow_back</span>
          Volver a Noticias
        </a>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
