<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión | Ecuador Comparte</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:linear-gradient(135deg,#4648d4 0%,#b4136d 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle}
    .login-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:1.5rem;padding:48px 40px;width:100%;max-width:440px;box-shadow:0 24px 64px rgba(15,23,46,0.25)}
    .logo{text-align:center;margin-bottom:8px;display:flex;justify-content:center}
    .logo img{height:80px;width:auto;object-fit:contain}
    .subtitle{text-align:center;color:#464554;font-size:14px;margin-bottom:36px}
    .form-group{margin-bottom:20px}
    .form-label{display:block;font-size:14px;font-weight:600;color:#131b2e;margin-bottom:6px}
    .form-input{width:100%;background:#f2f3ff;border:1px solid #c7c4d7;border-radius:12px;padding:12px 16px;font-size:16px;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
    .form-input:focus{border-color:#4648d4;box-shadow:0 0 0 3px rgba(70,72,212,0.12)}
    .btn-login{width:100%;background:linear-gradient(135deg,#4648d4,#b4136d);color:white;border:none;border-radius:999px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.2s,transform 0.1s;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
    .btn-login:hover{opacity:0.92}
    .btn-login:active{transform:scale(0.98)}
    .alert{padding:12px 16px;border-radius:8px;font-size:14px;margin-bottom:20px;display:flex;align-items:center;gap:8px}
    .alert--error{background:#ffdad6;color:#ba1a1a;border-left:4px solid #ba1a1a}
    .back-link{display:block;text-align:center;margin-top:24px;font-size:14px;color:#4648d4;text-decoration:none;font-weight:600}
    .back-link:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo"><img src="/static/img/logo.png" alt="Ecuador Comparte"/></div>
    <p class="subtitle">Panel de Administración</p>

    <div class="alert alert--error" th:if="${param.error}">
      <span class="material-symbols-outlined" style="font-size:18px">error</span>
      Credenciales incorrectas. Por favor intenta de nuevo.
    </div>
    <div class="alert" style="background:#dcfce7;color:#15803d;border-left:4px solid #16a34a" th:if="${param.logout}">
      <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
      Sesión cerrada exitosamente.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label" for="username">Correo electrónico</label>
        <input type="email" id="username" name="username" class="form-input" placeholder="admin@ecuadorcomparte.org" required autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-login">
        <span class="material-symbols-outlined" style="font-size:18px">lock_open</span>
        Iniciar Sesión
      </button>
    </form>
    <a href="/" class="back-link">← Volver al sitio</a>
  </div>
</body>
</html>
