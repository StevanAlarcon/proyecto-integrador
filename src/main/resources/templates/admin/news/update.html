<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Editar Noticia')}"></head>
<body>
<header style="position:fixed;top:0;width:100%;z-index:50;background:rgba(250,248,255,0.90);backdrop-filter:blur(12px);border-bottom:1px solid rgba(199,196,215,0.30);height:72px">
  <div style="max-width:1280px;margin:0 auto;padding:0 80px;height:100%;display:flex;align-items:center;justify-content:space-between">
    <a href="/"><img src="/static/img/logo.png" alt="Ecuador Comparte" style="height:52px;width:auto;object-fit:contain"/></a>
    <form th:action="@{/logout}" method="post"><button type="submit" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--color-on-surface-variant);font-family:inherit;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:20px">logout</span>Cerrar sesión</button></form>
  </div>
</header>
<div class="admin-layout">
  <aside class="sidebar">
    <a href="/admin" class="sidebar__link"><span class="material-symbols-outlined">dashboard</span>Resumen</a>
    <a href="/news" class="sidebar__link sidebar__link--active"><span class="material-symbols-outlined">newspaper</span>Noticias</a>
    <a href="/testimonials" class="sidebar__link"><span class="material-symbols-outlined">star</span>Testimonios</a>
    <a href="/contact-requests" class="sidebar__link"><span class="material-symbols-outlined">mail</span>Solicitudes</a>
    <a href="/admins" class="sidebar__link"><span class="material-symbols-outlined">manage_accounts</span>Administradores</a>

  </aside>
  <main class="admin-main">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
      <a href="/news" class="btn btn--outline btn--sm"><span class="material-symbols-outlined">arrow_back</span>Volver</a>
      <div><h1 class="headline-md" style="margin-bottom:4px">Editar Noticia</h1><p class="text-muted">Modifica los campos necesarios y guarda los cambios.</p></div>
    </div>
    <div class="form-card" style="max-width:800px;margin:0 auto">
      <form th:action="@{/news/{id}(id=${news.id})}" method="post">
        <input type="hidden" name="_method" value="PUT"/>
        <div class="form-group">
          <label class="form-label" for="title">Título *</label>
          <input type="text" id="title" name="title" class="form-input" th:value="${news.title}" required maxlength="200"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="summary">Resumen *</label>
          <textarea id="summary" name="summary" class="form-input form-textarea" th:text="${news.summary}" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="content">Contenido *</label>
          <textarea id="content" name="content" class="form-input form-textarea" style="min-height:200px" th:text="${news.content}" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="imageUrl">URL de Imagen *</label>
          <input type="url" id="imageUrl" name="imageUrl" class="form-input" th:value="${news.imageUrl}" required maxlength="500"/>
          <div th:if="${news.imageUrl}" style="margin-top:10px">
            <img th:src="${news.imageUrl}" alt="Preview" style="height:120px;border-radius:8px;object-fit:cover;border:1px solid rgba(199,196,215,0.40)"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="author">Autor *</label>
            <input type="text" id="author" name="author" class="form-input" th:value="${news.author}" required maxlength="100"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="publishDate">Fecha de Publicación *</label>
            <input type="datetime-local" id="publishDate" name="publishDate" class="form-input"
                   th:value="${#temporals.format(news.publishDate,'yyyy-MM-dd''T''HH:mm')}" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="status">Estado *</label>
          <select id="status" name="status" class="form-input form-select" required>
            <option th:each="s : ${newsStatuses}" th:value="${s.name()}" th:text="${s.displayName}"
                    th:selected="${s == news.status}">Estado</option>
          </select>
        </div>
        <div style="display:flex;gap:16px;margin-top:8px">
          <button type="submit" class="btn btn--gradient btn--md">
            <span class="material-symbols-outlined">save</span> Guardar Cambios
          </button>
          <a href="/news" class="btn btn--outline btn--md">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
