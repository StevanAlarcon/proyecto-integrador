<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Detalle Solicitud')}"></head>
<body>
<header style="position:fixed;top:0;width:100%;z-index:50;background:rgba(250,248,255,0.90);backdrop-filter:blur(12px);border-bottom:1px solid rgba(199,196,215,0.30);height:72px">
  <div style="max-width:1280px;margin:0 auto;padding:0 80px;height:100%;display:flex;align-items:center;justify-content:space-between">
    <a href="/"><img src="/static/img/logo.png" alt="Ecuador Comparte" style="height:52px;width:auto;object-fit:contain"/></a>
    <form th:action="@{/logout}" method="post"><button type="submit" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--color-on-surface-variant);font-family:inherit;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:20px">logout</span>Cerrar sesión</button></form>
  </div>
</header>
<div class="admin-layout">
  <aside class="sidebar">
    <a href="/admin" class="sidebar__link"><span class="material-symbols-outlined">dashboard</span>Resumen</a>
    <a href="/news" class="sidebar__link"><span class="material-symbols-outlined">newspaper</span>Noticias</a>
    <a href="/testimonials" class="sidebar__link"><span class="material-symbols-outlined">star</span>Testimonios</a>
    <a href="/contact-requests" class="sidebar__link sidebar__link--active"><span class="material-symbols-outlined">mail</span>Solicitudes</a>
    <a href="/admins" class="sidebar__link"><span class="material-symbols-outlined">manage_accounts</span>Administradores</a>

  </aside>
  <main class="admin-main">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
      <a href="/contact-requests" class="btn btn--outline btn--sm"><span class="material-symbols-outlined">arrow_back</span>Volver</a>
      <h1 class="headline-md">Detalle de Solicitud</h1>
    </div>
    <div class="form-card" style="max-width:600px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid rgba(199,196,215,0.20)">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:24px;font-weight:700;color:white" th:text="${#strings.substring(contactRequest.name,0,1)}">?</span>
        </div>
        <div>
          <h2 class="headline-sm" th:text="${contactRequest.name}">Nombre</h2>
          <span class="badge"
            th:class="${contactRequest.purpose.name() == 'PROGRAMA_EDIFICA'} ? 'badge badge--blue' : (${contactRequest.purpose.name() == 'SHOWS_Y_CONFERENCIAS'} ? 'badge badge--primary' : 'badge badge--green')"
            th:text="${contactRequest.purpose.displayName}">Propósito</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px">
        <div>
          <p class="label-sm text-muted" style="text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">Email</p>
          <a th:href="'mailto:' + ${contactRequest.email}" style="color:var(--color-primary);font-weight:600;text-decoration:none" th:text="${contactRequest.email}">email</a>
        </div>
        <div>
          <p class="label-sm text-muted" style="text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">Teléfono</p>
          <a th:href="'tel:' + ${contactRequest.phoneNumber}" style="color:var(--color-primary);font-weight:600;text-decoration:none" th:text="${contactRequest.phoneNumber}">tel</a>
        </div>
        <div>
          <p class="label-sm text-muted" style="text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">Fecha de Solicitud</p>
          <p th:text="${#temporals.format(contactRequest.createDate,'dd MMMM yyyy, HH:mm')}">Fecha</p>
        </div>
        <div>
          <p class="label-sm text-muted" style="text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px">ID</p>
          <p class="label-sm" style="font-family:monospace" th:text="'#' + ${contactRequest.id}">ID</p>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <a th:href="'mailto:' + ${contactRequest.email}" class="btn btn--gradient btn--md">
          <span class="material-symbols-outlined">mail</span> Responder por Email
        </a>
        <a th:href="@{/contact-requests/delete/{id}(id=${contactRequest.id})}" class="btn btn--danger btn--md">
          <svg th:replace="fragments/icons :: delete"></svg> Eliminar
        </a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
