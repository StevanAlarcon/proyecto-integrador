<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Editar Administrador')}"></head>
<body>
<header style="position:fixed;top:0;width:100%;z-index:50;background:rgba(250,248,255,0.90);backdrop-filter:blur(12px);border-bottom:1px solid rgba(199,196,215,0.30);height:72px">
  <div style="max-width:1280px;margin:0 auto;padding:0 80px;height:100%;display:flex;align-items:center;justify-content:space-between">
    <a href="/"><img src="/static/img/logo.png" alt="Ecuador Comparte" style="height:52px;width:auto;object-fit:contain"/></a>
    <form th:action="@{/logout}" method="post"><button type="submit" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--color-on-surface-variant);font-family:inherit;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:20px">logout</span>Cerrar sesión</button></form>
  </div>
</header>
<div class="admin-layout">
  <aside class="sidebar">
    <a href="/admin" class="sidebar__link"><span class="material-symbols-outlined">dashboard</span>Resumen</a>
    <a href="/news" class="sidebar__link"><span class="material-symbols-outlined">newspaper</span>Noticias</a>
    <a href="/testimonials" class="sidebar__link"><span class="material-symbols-outlined">star</span>Testimonios</a>
    <a href="/contact-requests" class="sidebar__link"><span class="material-symbols-outlined">mail</span>Solicitudes</a>
    <a href="/admins" class="sidebar__link sidebar__link--active"><span class="material-symbols-outlined">manage_accounts</span>Administradores</a>

  </aside>
  <main class="admin-main">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
      <a href="/admins" class="btn btn--outline btn--sm"><span class="material-symbols-outlined">arrow_back</span>Volver</a>
      <div><h1 class="headline-md" style="margin-bottom:4px">Editar Administrador</h1><p class="text-muted">Modifica los datos del administrador.</p></div>
    </div>
    <div class="form-card" style="max-width:640px;margin:0 auto">
      <form th:action="@{/admins/{id}(id=${admin.id})}" method="post">
        <input type="hidden" name="_method" value="PUT"/>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">Nombre *</label>
            <input type="text" id="name" name="name" class="form-input" th:value="${admin.name}" required th:maxlength="${nameMaxLength}"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="surname">Apellido *</label>
            <input type="text" id="surname" name="surname" class="form-input" th:value="${admin.surname}" required th:maxlength="${surnameMaxLength}"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email *</label>
          <input type="email" id="email" name="email" class="form-input" th:value="${admin.email}" required th:maxlength="${emailMaxLength}"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Nueva Contraseña <span class="text-muted">(dejar vacío para no cambiar)</span></label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Nueva contraseña..." th:maxlength="${passwordMaxLength}"/>
        </div>
        <div style="display:flex;gap:16px;margin-top:8px">
          <button type="submit" class="btn btn--gradient btn--md">
            <span class="material-symbols-outlined">save</span> Guardar Cambios
          </button>
          <a href="/admins" class="btn btn--outline btn--md">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
