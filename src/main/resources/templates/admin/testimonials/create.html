<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(pageTitle='Nuevo Testimonio')}"></head>
<body>
<header style="position:fixed;top:0;width:100%;z-index:50;background:rgba(250,248,255,0.90);backdrop-filter:blur(12px);border-bottom:1px solid rgba(199,196,215,0.30);height:72px">
  <div style="max-width:1280px;margin:0 auto;padding:0 80px;height:100%;display:flex;align-items:center;justify-content:space-between">
    <a href="/"><img src="/static/img/logo.png" alt="Ecuador Comparte" style="height:52px;width:auto;object-fit:contain"/></a>
    <form th:action="@{/logout}" method="post"><button type="submit" style="background:none;border:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--color-on-surface-variant);font-family:inherit;display:flex;align-items:center;gap:6px"><span class="material-symbols-outlined" style="font-size:20px">logout</span>Cerrar sesión</button></form>
  </div>
</header>
<div class="admin-layout">
  <aside class="sidebar">
    <a href="/admin" class="sidebar__link"><span class="material-symbols-outlined">dashboard</span>Resumen</a>
    <a href="/news" class="sidebar__link"><span class="material-symbols-outlined">newspaper</span>Noticias</a>
    <a href="/testimonials" class="sidebar__link sidebar__link--active"><span class="material-symbols-outlined">star</span>Testimonios</a>
    <a href="/contact-requests" class="sidebar__link"><span class="material-symbols-outlined">mail</span>Solicitudes</a>
    <a href="/admins" class="sidebar__link"><span class="material-symbols-outlined">manage_accounts</span>Administradores</a>

  </aside>
  <main class="admin-main">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
      <a href="/testimonials" class="btn btn--outline btn--sm"><span class="material-symbols-outlined">arrow_back</span>Volver</a>
      <div><h1 class="headline-md" style="margin-bottom:4px">Nuevo Testimonio</h1><p class="text-muted">Agrega un nuevo testimonio para mostrar en la página de inicio.</p></div>
    </div>
    <div class="form-card" style="max-width:640px;margin:0 auto">
      <form th:action="@{/testimonials}" method="post">
        <div class="form-group">
          <label class="form-label" for="name">Nombre *</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Nombre completo" required maxlength="50"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="photoUrl">URL de Foto *</label>
          <input type="url" id="photoUrl" name="photoUrl" class="form-input" placeholder="https://..." required maxlength="500" oninput="previewPhoto(this.value)"/>
          <div id="photoPreview" style="margin-top:10px;display:none">
            <img id="previewImg" src="" alt="Preview" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--color-primary-fixed)"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="InstagramUrl">URL de Instagram *</label>
            <input type="url" id="InstagramUrl" name="InstagramUrl" class="form-input" placeholder="https://instagram.com/..." required maxlength="500"/>
          </div>
          <div class="form-group">
            <label class="form-label" for="FacebookUrl">URL de Facebook *</label>
            <input type="url" id="FacebookUrl" name="FacebookUrl" class="form-input" placeholder="https://facebook.com/..." required maxlength="500"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="createDate">Fecha *</label>
          <input type="datetime-local" id="createDate" name="createDate" class="form-input" required/>
        </div>
        <div style="display:flex;gap:16px;margin-top:8px">
          <button type="submit" class="btn btn--gradient btn--md">
            <span class="material-symbols-outlined">save</span> Crear Testimonio
          </button>
          <a href="/testimonials" class="btn btn--outline btn--md">Cancelar</a>
        </div>
      </form>
    </div>
  </main>
</div>
<script>
function previewPhoto(url) {
  const wrap = document.getElementById('photoPreview');
  const img  = document.getElementById('previewImg');
  if (url) { img.src = url; wrap.style.display = 'block'; }
  else { wrap.style.display = 'none'; }
}
// Default createDate to now
document.getElementById('createDate').value = new Date().toISOString().slice(0,16);
</script>
</body>
</html>
